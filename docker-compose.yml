version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: honeychain_postgres
    restart: always
    environment:
      POSTGRES_USER: honeyuser
      POSTGRES_PASSWORD: honeypassword
      POSTGRES_DB: honeychain_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: honeychain_mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

volumes:
  postgres_data:
